[project]
name = "medagenda-poc-agent"
version = "3.0"
description = "POC de agendamento de consultas com FastAPI e LangGraph"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.17,<2",
    "fastapi>=0.115,<1",
    "langchain-core>=1,<2",
    "langchain-google-genai>=4,<5",
    "langchain-openai>=1,<2",
    "langfuse>=5,<6",
    "langgraph>=1,<2",
    "langgraph-checkpoint-postgres>=3,<4",
    "langgraph-checkpoint-sqlite>=3,<4",
    "psycopg[binary,pool]>=3.2,<4",
    "pydantic>=2,<3",
    "python-dotenv>=1,<2",
    "requests>=2,<3",
    "sqlalchemy>=2.0,<2.1",
    "streamlit>=1,<2",
    "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<10",
]

[tool.uv]
package = false
