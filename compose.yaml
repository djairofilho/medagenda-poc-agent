services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: medagenda
      POSTGRES_PASSWORD: medagenda
      POSTGRES_DB: medagenda
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medagenda -d medagenda"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  postgres_data:
